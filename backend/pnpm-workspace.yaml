# Native deps (sharp, esbuild, unrs-resolver) ship prebuilt platform binaries via
# optional dependencies, so their install/build scripts aren't required to run.
# Don't fail the install when pnpm skips those unapproved build scripts.
strictDepBuilds: false
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - esbuild
  - sharp
  - unrs-resolver
